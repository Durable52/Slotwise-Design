services:
  postgres:
    image: postgres:17-alpine
    container_name: slotwise-postgres
    environment:
      POSTGRES_DB: slotwise
      POSTGRES_USER: slotwise
      POSTGRES_PASSWORD: slotwise
    ports:
      - "5432:5432"
    volumes:
      - slotwise-postgres:/var/lib/postgresql/data

volumes:
  slotwise-postgres:

